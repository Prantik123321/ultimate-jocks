        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;

                radial-gradient(

<body>

<div class="card">

    <h1>
        🎭 হাসি-মজা
        <span>∞ AUTO</span>
    </h1>

    <div class="content-box">

        <div id="loader" class="loader"></div>

        <div
            id="mainContent"
            class="hidden"
        ></div>

    </div>

    <div class="actions">

        <button
            id="nextBtn"
        >
            ⟳ পরেরটা
        </button>

        <button
            id="jokeBtn"
        >
            😂 Joke
        </button>

        <button
            id="memeBtn"
        >
            🖼️ Meme
        </button>

        <button
            id="gifBtn"
        >
            🎬 GIF
        </button>

    </div>

    <div class="footer">
        🌐 Multiple APIs • Automatic content • Duplicate protection
    </div>

</div>

<script>

(function () {

    const loader =
        document.getElementById("loader");

    const mainContent =
        document.getElementById("mainContent");

    const nextBtn =
        document.getElementById("nextBtn");

    const jokeBtn =
        document.getElementById("jokeBtn");

    const memeBtn =
        document.getElementById("memeBtn");

    const gifBtn =
        document.getElementById("gifBtn");

    let loading = false;

    function setLoading(value) {

        loading = value;

        if (value) {

            loader.classList.remove("hidden");

            mainContent.classList.add("hidden");

            mainContent.innerHTML = "";

            nextBtn.disabled = true;
            jokeBtn.disabled = true;
            memeBtn.disabled = true;
            gifBtn.disabled = true;

        } else {

            loader.classList.add("hidden");

            mainContent.classList.remove("hidden");

            nextBtn.disabled = false;
            jokeBtn.disabled = false;
            memeBtn.disabled = false;
            gifBtn.disabled = false;
        }
    }

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent =
            String(text || "");

        return div.innerHTML;
    }

    function render(data) {

        mainContent.innerHTML = "";

        if (!data) {

            mainContent.innerHTML =
                `<div class="joke-text">
                    😵 কিছু পাওয়া যায়নি।
                </div>`;

            return;
        }

        /* IMAGE / GIF */

        if (data.type === "image") {

            const img =
                document.createElement("img");

            img.className = "media";

            img.src = data.content;

            img.alt = "Meme";

            img.loading = "eager";

            img.onerror = function () {

                loadContent("all", true);

            };

            mainContent.appendChild(img);

            return;
        }

        /* TEXT */

        if (data.type === "text") {

            const box =
                document.createElement("div");

            box.className = "joke-text";

            const content =
                data.content;

            if (
                typeof content === "object" &&
                content !== null
            ) {

                const setup =
                    escapeHTML(content.setup);

                const delivery =
                    escapeHTML(content.delivery);

                box.innerHTML = `
                    <strong>${setup}</strong>

                    <div class="delivery">
                        ${delivery}
                    </div>
                `;

            } else {

                box.textContent =
                    String(content || "😂");
            }

            if (data.meta?.source) {

                const source =
                    document.createElement("small");

                source.className = "source";

                source.textContent =
                    `✦ Source: ${data.meta.source}`;

                box.appendChild(source);
            }

            mainContent.appendChild(box);

            return;
        }

        mainContent.innerHTML =
            `<div class="joke-text">
                😵 Unknown content
            </div>`;
    }

    async function loadContent(
        mode = "all",
        silent = false
    ) {

        if (loading && !silent) {
            return;
        }

        if (!silent) {
            setLoading(true);
        }

        try {

            const url =
                mode === "all"
                    ? "/api/joke"
                    : `/api/joke?mode=${encodeURIComponent(mode)}`;

            const response =
                await fetch(url, {
                    headers: {
                        Accept:
                            "application/json"
                    },
                    cache: "no-store"
                });

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            if (!data?.type) {
                throw new Error(
                    "Invalid API response"
                );
            }

            render(data);

        } catch (error) {

            console.error(error);

            mainContent.classList.remove(
                "hidden"
            );

            mainContent.innerHTML =
                `<div class="joke-text">
                    😵 Content পাওয়া যাচ্ছে না।
                    <br>
                    <small>
                        আবার চেষ্টা করো।
                    </small>
                </div>`;

        } finally {

            if (!silent) {
                setLoading(false);
            }
        }
    }

    window.addEventListener(
        "load",
        () => loadContent("all")
    );

    nextBtn.addEventListener(
        "click",
        () => loadContent("all")
    );

    jokeBtn.addEventListener(
        "click",
        () => loadContent("joke")
    );

    memeBtn.addEventListener(
        "click",
        () => loadContent("meme")
    );

    gifBtn.addEventListener(
        "click",
        () => loadContent("gif")
    );

})();

</script>

</body>
</html>
