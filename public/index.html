<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আনলিমিটেড জোকস ও মেমস</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #18191a;
      color: #e4e6eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #242526;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .header {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #f0f2f5;
    }
    .content-box {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
    }
    .media {
      max-width: 100%;
      max-height: 280px;
      border-radius: 10px;
      margin-bottom: 12px;
      object-fit: contain;
    }
    .joke-text {
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-line;
      font-weight: 500;
    }
    .btn {
      background: #2d88ff;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #1a73e8; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #4e5052; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">🔥 আনলিমিটেড ফানি জোকস ও মেমস 🔥</div>
  <div class="content-box" id="container">
    <p class="joke-text">লোড হচ্ছে...</p>
  </div>
  <button class="btn" id="next-btn" onclick="nextContent()">পরেরটা দেখুন ➡️</button>
</div>

<script>
  let isFetching = false;

  async function nextContent() {
    if (isFetching) return;
    isFetching = true;

    const container = document.getElementById('container');
    const btn = document.getElementById('next-btn');
    
    btn.disabled = true;
    container.innerHTML = '<p class="joke-text">নতুন কন্টেন্ট ফেচ করা হচ্ছে...</p>';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 9000);

    try {
      const response = await fetch('/api/joke', { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error('API Error');

      const data = await response.json();
      container.innerHTML = '';

      if (data.type === 'image' && data.url) {
        const img = document.createElement('img');
        img.src = data.url;
        img.className = 'media';
        
        // ইমেজ বা GIF লোড না হলে পরবর্তী API ট্রাই করবে
        img.onerror = () => {
          isFetching = false;
          btn.disabled = false;
          nextContent();
        };

        container.appendChild(img);
      }

      if (data.text || data.content) {
        const p = document.createElement('p');
        p.className = 'joke-text';
        p.innerText = data.text || data.content;
        container.appendChild(p);
      }
    } catch (err) {
      // ব্যাকএন্ড বা নেটওয়ার্ক ডাউনে স্ক্রিন স্টাক না রেখে সাথে সাথে নতুন রিকোয়েস্ট পাঠাবে
      isFetching = false;
      btn.disabled = false;
      setTimeout(nextContent, 1000);
    } finally {
      isFetching = false;
      btn.disabled = false;
    }
  }

  nextContent();
</script>

</body>
</html>
