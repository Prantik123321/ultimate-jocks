<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আনলিমিটেড জোকস ও মেমস</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1e1e2e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #2b2b3d;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .content-box {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
    }
    .media {
      max-width: 100%;
      max-height: 260px;
      border-radius: 12px;
      margin-bottom: 12px;
      object-fit: contain;
    }
    .joke-text {
      font-size: 18px;
      line-height: 1.5;
      white-space: pre-line;
      font-weight: 500;
    }
    .btn {
      background: #ff5252;
      color: white;
      border: none;
      padding: 14px 25px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn:hover { background: #ff7979; }
    .btn:disabled { background: #7f8c8d; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card">
  <h2>🔥 আনলিমিটেড ফান 🔥</h2>
  <div class="content-box" id="container">
    <p class="joke-text">লোড হচ্ছে...</p>
  </div>
  <button class="btn" id="next-btn" onclick="nextContent()">পরেরটা ➡️</button>
</div>

<script>
  let isFetching = false;

  async function nextContent() {
    if (isFetching) return;
    isFetching = true;

    const container = document.getElementById('container');
    const btn = document.getElementById('next-btn');
    
    btn.disabled = true;
    container.innerHTML = '<p class="joke-text">নতুন কন্টেন্ট লোড হচ্ছে...</p>';

    // ৮ সেকেন্ডের Fetch Timeout সেট করা হলো
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);

    try {
      const response = await fetch('/api/joke', { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error('API Error');

      const data = await response.json();
      container.innerHTML = '';

      if (data.type === 'image' && data.url) {
        const img = document.createElement('img');
        img.src = data.url;
        img.className = 'media';
        
        // ছবি বা GIF লোড না হতে পারলে অটোমেটিক স্কিপ
        img.onerror = () => {
          isFetching = false;
          btn.disabled = false;
          nextContent();
        };

        container.appendChild(img);
      }

      if (data.text || data.content) {
        const p = document.createElement('p');
        p.className = 'joke-text';
        p.innerText = data.text || data.content;
        container.appendChild(p);
      }
    } catch (err) {
      // এরর হলেও ফলব্যাক মেসেজ দিয়ে স্ক্রিন আনস্টাক করা হবে
      container.innerHTML = '<p class="joke-text">😊 "প্রোগ্রামাররা কেন ডার্ক মোড ব্যবহার করে?\n\n🤣 কারণ আলোতে অনেক বাগ চলে আসে!"</p>';
    } finally {
      isFetching = false;
      btn.disabled = false;
    }
  }

  nextContent();
</script>

</body>
</html>
